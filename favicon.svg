<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f0f4f8" stroke="#ccd" stroke-width="1"/>

  <!-- Tank cylindrical body (14% wider, moved up 4px) -->
  <rect x="8" y="36" width="48" height="16" fill="#b8cfe0" stroke="#5a80a8" stroke-width="1.5"/>
  <!-- Tank top ellipse -->
  <ellipse cx="32" cy="36" rx="24" ry="5" fill="#d0e4f4" stroke="#5a80a8" stroke-width="1.5"/>
  <!-- Tank bottom ellipse -->
  <ellipse cx="32" cy="52" rx="24" ry="4" fill="#a8bcd4" stroke="#5a80a8" stroke-width="1"/>

  <!-- Shorter wavy odor lines -->
  <path d="M 20 32 C 14 25 26 20 20 14 C 14 9 22 7 20 7"
        fill="none" stroke="#8b4513" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 32 32 C 26 25 38 20 32 14 C 26 9 34 7 32 7"
        fill="none" stroke="#6b3010" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 44 32 C 38 25 50 20 44 14 C 38 9 46 7 44 7"
        fill="none" stroke="#8b4513" stroke-width="3.5" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f0f4f8" stroke="#ccd" stroke-width="1"/>

  <!-- Tank cylindrical body -->
  <rect x="11" y="40" width="42" height="16" fill="#b8cfe0" stroke="#5a80a8" stroke-width="1.5"/>
  <!-- Tank top ellipse (open top) -->
  <ellipse cx="32" cy="40" rx="21" ry="5" fill="#d0e4f4" stroke="#5a80a8" stroke-width="1.5"/>
  <!-- Tank bottom ellipse (closed) -->
  <ellipse cx="32" cy="56" rx="21" ry="4" fill="#a8bcd4" stroke="#5a80a8" stroke-width="1"/>

  <!-- Wavy odor lines rising from tank -->
  <path d="M 20 36 C 14 28 26 22 20 14 C 14 7 22 4 20 3"
        fill="none" stroke="#8b4513" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 32 36 C 26 28 38 22 32 14 C 26 7 34 4 32 3"
        fill="none" stroke="#6b3010" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 44 36 C 38 28 50 22 44 14 C 38 7 46 4 44 3"
        fill="none" stroke="#8b4513" stroke-width="3.5" stroke-linecap="round"/>
</svg>
